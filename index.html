<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Royal Park Golf</title>
  <meta name="theme-color" content="#2f5d34">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="safe" aria-hidden="true"></div>
  <main id="app">
    <div id="screen">
      <canvas id="game" width="288" height="216" aria-label="Golf hole view. Drag to aim."></canvas>

      <div id="title" class="overlay">
        <div class="card">
          <h1>ROYAL PARK</h1>
          <p>9 HOLES · PAR 35</p>
          <p class="small">2316 YARDS · PARKVILLE</p>
          <button id="resumeBtn" type="button" hidden>CONTINUE</button>
          <button id="startBtn" type="button" disabled>LOADING THE PARK…</button>
          <p class="small">OR PRACTISE ONE HOLE</p>
          <div id="holePick" class="holes"></div>
          <p class="small how">TOUCH THE BALL, PULL BACK,<br>THEN FLICK UP TO HIT.<br>FLICK LEFT OR RIGHT TO<br>CURVE IT. DRAG ANYWHERE<br>ELSE TO AIM. PUTTING: PULL<br>BACK AND LET GO.</p>
        </div>
      </div>

      <div id="end" class="overlay" hidden>
        <div class="card">
          <h1 id="endTitle">IN THE HOLE!</h1>
          <p id="endScore"></p>
          <table id="card" class="scorecard"></table>
          <button id="againBtn" type="button">PLAY AGAIN</button>
          <div class="row">
            <button id="replayBtn" class="minor" type="button" hidden>REPLAY</button>
            <button id="menuBtn" class="minor" type="button">MENU</button>
          </div>
        </div>
      </div>
    </div>

  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
